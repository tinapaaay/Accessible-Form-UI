<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Accessible Form UI</title>
  <meta
    name="description"
    content="An accessible static form user interface built with HTML and CSS."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="form-page">
    <section class="form-card" aria-labelledby="form-title">
      <div class="form-intro">
        <p class="eyebrow">Create your account</p>
        <h1 id="form-title">Sign up</h1>
        <p>Complete the form below to get started.</p>
      </div>

      <div class="progress-section">
        <div class="progress-label">
          <p>Profile completeness</p>
          <strong>0%</strong>
        </div>

        <div
          class="progress-bar"
          role="progressbar"
          aria-label="Profile completeness"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span></span>
        </div>
      </div>

      <form>
        <div class="form-group">
          <label for="full-name">Full name</label>
          <input
            type="text"
            id="full-name"
            name="full-name"
            autocomplete="name"
            required
            aria-required="true"
            aria-describedby="name-error"
          >
          <p class="error-message" id="name-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            aria-required="true"
            aria-describedby="email-error"
          >
          <p class="error-message" id="email-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-input">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              required
              aria-required="true"
              aria-describedby="password-help password-error"
            >

            <button
              type="button"
              class="toggle-password"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>

          <p class="helper-text" id="password-help">
            Use at least 8 characters.
          </p>
          <p class="error-message" id="password-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>

          <div class="password-input">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              autocomplete="new-password"
              required
              aria-required="true"
              aria-describedby="confirm-password-error"
            >

            <button
              type="button"
              class="toggle-password"
              aria-label="Show confirm password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>

          <p
            class="error-message"
            id="confirm-password-error"
            aria-live="polite"
          ></p>
        </div>

        <button type="submit" class="submit-button">Create account</button>
      </form>

      <aside class="requirements" aria-labelledby="requirements-title">
        <h2 id="requirements-title">Password requirements</h2>

        <ul>
          <li class="complete">At least 8 characters</li>
          <li class="complete">One uppercase letter</li>
          <li class="complete">One number</li>
          <li>Passwords match</li>
        </ul>
      </aside>
    </section>
  </main>
</body>
</html>
